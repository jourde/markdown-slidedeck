<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Slide Deck</title>
  <style>
    :root {
      --bg-a: #ffffff;
      --bg-b: #f2f5fa;
      --text: #1e2430;
      --muted: #4f5a6d;
      --accent: #1c7ed6;
      --accent-hover: #176ab5;
      --focus-ring: #0f62b2;
      --slide-font: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--slide-font);
      background: radial-gradient(circle at top left, var(--bg-a) 0%, var(--bg-b) 100%);
      overflow: hidden;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 200;
      padding: 8px 10px;
      border-radius: 8px;
      background: #ffffff;
      color: #10375f;
      border: 2px solid #9fc3e8;
      transform: translateY(-160%);
      transition: transform 120ms ease;
      text-decoration: none;
      font-weight: 700;
    }

    .skip-link:focus-visible {
      transform: translateY(0);
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .app {
      height: 100vh;
      width: 100%;
      padding: clamp(20px, 4vw, 44px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .app-title {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 2.2vw, 2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: #1b2638;
      font-weight: 800;
    }

    .app-footer {
      width: min(1280px, 100%);
      display: none;
      justify-content: center;
      padding: 10px 0 4px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .app.show-footer .app-footer {
      display: flex;
    }

    .repo-link {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 0.14em;
      font-weight: 600;
    }

    .repo-link:hover {
      color: var(--accent-hover);
    }

    .upload-cta {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(28, 126, 214, 0.22);
      transition: background 140ms ease, transform 140ms ease;
    }

    .upload-cta:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .upload-cta:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .upload-cta svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .slide-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      width: min(1280px, 100%);
      display: flex;
      flex-direction: column;
    }

    .slide {
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0;
      line-height: 1.5;
      font-size: clamp(1rem, 1.18vw, 1.4rem);
    }

    .slide-center {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vw, 24px);
      position: relative;
    }

    .slide-continue-hint {
      position: fixed;
      right: 68px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
      z-index: 40;
      animation: hint-nudge 2s ease-in-out infinite;
    }

    .slide-continue-hint .material-symbols-outlined {
      font-size: 2.8rem;
      display: block;
    }

    @keyframes hint-nudge {
      0%, 100% { transform: translateY(-50%) translateX(0);   opacity: 0.55; }
      50%       { transform: translateY(-50%) translateX(5px); opacity: 1;    }
    }

    .slide.is-tall .slide-center {
      align-items: flex-start;
    }

    .slide-content {
      width: min(1100px, 100%);
      transform-origin: top center;
    }

    .train-map {
      --station-size: 22px;
      --station-center-y: 22px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px 8px;
      background: linear-gradient(to top, rgba(255,255,255,0.97) 55%, rgba(255,255,255,0));
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .app.train-visible .train-map {
      opacity: 1;
      pointer-events: auto;
    }

    .train-track {
      position: absolute;
      left: 24px;
      right: 24px;
      height: 4px;
      background: #d3dbe8;
      border-radius: 999px;
      top: var(--station-center-y);
      transform: translateY(-50%);
    }

    .train-progress {
      position: absolute;
      left: 24px;
      height: 4px;
      background: #6eaee8;
      border-radius: 999px;
      top: var(--station-center-y);
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 0;
      transition: width 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .station-list {
      position: absolute;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      top: calc(var(--station-center-y) - (var(--station-size) / 2));
      z-index: 1;
    }

    .station-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      min-width: 18px;
    }

    .station {
      width: var(--station-size);
      height: var(--station-size);
      border-radius: 999px;
      border: 2px solid #c0cbdd;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    .station:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .station::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: #b9c6da;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .station:hover {
      transform: translateY(-1px);
      border-color: #8ea3c0;
    }

    .station.past {
      border-color: #6eaee8;
      background: #e6f2ff;
    }

    .station.past::after {
      background: #6eaee8;
    }

    @keyframes stationPulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(28, 126, 214, 0.18); }
      50%       { box-shadow: 0 0 0 7px rgba(28, 126, 214, 0.08); }
    }

    .station.active {
      border-color: var(--accent);
      background: var(--accent);
      transform: translateY(-1px);
      animation: stationPulse 2.2s ease-in-out infinite;
    }

    .station.active::after {
      background: #ffffff;
    }

    .station-num {
      font-size: 10px;
      line-height: 1;
      color: #667287;
      font-weight: 600;
      user-select: none;
    }

    .station-duration {
      font-size: 9px;
      line-height: 1;
      color: #8595ac;
      font-weight: 500;
      user-select: none;
    }

    .station-label {
      font-size: 8px;
      line-height: 1;
      color: #8595ac;
      font-weight: 500;
      max-width: 36px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: none;
    }

    .train-map.has-durations {
      height: 96px;
    }

    .section-tick {
      position: absolute;
      top: calc(var(--station-center-y) - 6px);
      transform: translateX(-50%) translateY(-50%);
      width: 2px;
      height: 12px;
      background: rgba(28, 126, 214, 0.35);
      border-radius: 1px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Overview mode ─────────────────────────────────────────── */
    .overview {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(10, 18, 32, 0.95);
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 40px 64px;
    }

    .overview[hidden] {
      display: none;
    }

    /* ── Playlist panel ── */
    .playlist-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #d5deeb;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(21, 34, 54, 0.18);
      padding: 16px;
      width: min(480px, calc(100vw - 48px));
    }
    .playlist-panel[hidden] { display: none; }
    .playlist-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .playlist-panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1b2638;
      margin: 0;
    }
    .playlist-panel-close {
      border: 0;
      background: transparent;
      color: #667287;
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 8px;
      border-radius: 6px;
      line-height: 1.4;
    }
    .playlist-panel-close:hover { color: #1e2430; }
    .playlist-panel-close:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
    .playlist-mode-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid #e4ecf5;
    }
    .playlist-tab {
      border: 0;
      background: transparent;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #667287;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      border-radius: 6px 6px 0 0;
      transition: color 120ms, border-color 120ms;
    }
    .playlist-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .playlist-tab:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
    .playlist-mode-pane { display: none; flex-direction: column; gap: 8px; }
    .playlist-mode-pane.active { display: flex; }
    .playlist-url-input, .playlist-textarea {
      width: 100%;
      border: 1px solid #c6d2e4;
      border-radius: 8px;
      padding: 8px 10px;
      color: #1f2b3f;
      box-sizing: border-box;
    }
    .playlist-url-input { font-size: 0.87rem; }
    .playlist-textarea {
      font-size: 0.82rem;
      font-family: ui-monospace, "SF Mono", "Fira Code", monospace;
      min-height: 110px;
      resize: vertical;
    }
    .playlist-url-input:focus-visible, .playlist-textarea:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 1px;
      border-color: #7ea9d6;
    }
    .playlist-load-btn {
      align-self: flex-end;
      padding: 0 16px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 140ms;
    }
    .playlist-load-btn:hover { background: var(--accent-hover); }
    .playlist-load-btn:disabled { opacity: 0.5; cursor: default; }
    .playlist-load-btn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
    .playlist-status { font-size: 0.8rem; color: var(--muted); min-height: 1.1em; }
    .playlist-error { font-size: 0.82rem; color: #c0392b; }
    .playlist-error[hidden] { display: none; }

    /* ── Deck overlay ── */
    #deckOverlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(10, 18, 32, 0.95);
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 40px 64px;
    }
    #deckOverlay[hidden] { display: none; }
    .deck-overlay-hint {
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 32px;
      flex-shrink: 0;
    }
    .deck-grid {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
    }
    .deck-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 160px;
      max-width: 220px;
      cursor: pointer;
      transition: background 140ms, border-color 140ms, transform 140ms;
    }
    .deck-card:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.28); transform: translateY(-2px); }
    .deck-card:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
    .deck-card.active { border-color: var(--accent); background: rgba(28,126,214,0.18); }
    .deck-card.loading, .deck-card.error { cursor: default; }
    .deck-card.loading { opacity: 0.7; }
    .deck-card.error { opacity: 0.55; }
    .deck-card-num { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.35); letter-spacing: 0.05em; }
    .deck-card-status { font-size: 1.5rem; line-height: 1; }
    .deck-card-label { font-size: 0.8rem; color: rgba(255,255,255,0.75); text-align: center; line-height: 1.35; word-break: break-word; }

    .overview-hint {
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 32px;
      flex-shrink: 0;
    }

    .overview-grid {
      display: flex;
      flex-direction: row;
      gap: 28px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .overview-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .overview-col-title {
      color: rgba(255, 255, 255, 0.45);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      max-width: 192px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overview-card {
      width: 192px;
      height: 128px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: #fff;
      transition: border-color 140ms ease, box-shadow 140ms ease;
      flex-shrink: 0;
    }

    .overview-card:hover {
      border-color: rgba(28, 126, 214, 0.7);
      box-shadow: 0 0 0 3px rgba(28, 126, 214, 0.2);
    }

    .overview-card.active {
      border-color: var(--accent, #1c7ed6);
      box-shadow: 0 0 0 3px rgba(28, 126, 214, 0.35);
    }

    .overview-card-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 800px;
      height: 533px;
      transform: scale(0.24);
      transform-origin: top left;
      overflow: hidden;
      pointer-events: none;
      padding: 40px 48px;
      box-sizing: border-box;
      font-size: 16px;
      line-height: 1.5;
    }

    .overview-card-num {
      position: absolute;
      bottom: 5px;
      right: 7px;
      font-size: 9px;
      color: rgba(0, 0, 0, 0.25);
      font-weight: 600;
      pointer-events: none;
    }

    .train-resize-handle {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      cursor: ns-resize;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .train-resize-handle::before {
      content: '';
      width: 28px;
      height: 3px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.12);
      transition: background 150ms ease;
    }

    .train-resize-handle:hover::before {
      background: rgba(28, 126, 214, 0.5);
    }

    .train-map.is-2d {
      min-height: 80px;
      overflow-x: auto;
      overflow-y: auto;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 18px 16px 10px;
      background: rgba(255, 255, 255, 0.97);
    }

    .train-grid {
      display: flex;
      flex-direction: row;
      gap: 10px;
      align-items: flex-start;
    }

    .train-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 8px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      min-width: 48px;
      position: relative;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .train-col.active-col {
      background: rgba(28, 126, 214, 0.06);
      border-color: rgba(28, 126, 214, 0.28);
    }

    .col-progress {
      position: absolute;
      bottom: 4px;
      left: 8px;
      right: 8px;
      height: 3px;
      background: rgba(28, 126, 214, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    .col-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .train-col-header {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #667287;
      text-transform: uppercase;
      text-align: center;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
      user-select: none;
    }

    .train-col.active-col .train-col-header {
      color: var(--accent);
    }

    .duration-bar {
      width: min(1100px, 100%);
      padding: 4px 24px 8px;
    }

    .slide-duration-bar-track {
      position: absolute;
      bottom: 4px;
      left: 24px;
      right: 24px;
      height: 4px;
      background: rgba(110, 174, 232, 0.2);
      border-radius: 999px;
      overflow: hidden;
    }

    #durationBar .slide-duration-bar-track {
      flex: 1;
      position: static;
      bottom: auto;
      left: auto;
      right: auto;
      height: 6px;
    }

    .duration-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .duration-bar-label {
      display: flex;
      align-items: baseline;
      gap: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .duration-bar-label-title {
      font-size: 0.68rem;
      font-weight: 600;
      color: #8595ac;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .duration-bar-label-mins {
      font-size: 0.68rem;
      font-weight: 500;
      color: #8595ac;
    }

    .slide-duration-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      animation-name: slide-duration-fill;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes slide-duration-fill {
      from { width: 0% }
      to   { width: 100% }
    }

    .map-toggle {
      position: fixed;
      right: 16px;
      bottom: 378px;
      border: 0;
      border-radius: 999px;
      background: #ffffff;
      color: #2e3c54;
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(21, 34, 54, 0.14);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .map-toggle .material-symbols-outlined {
      font-size: 24px;
      line-height: 1;
    }

    .duration-bar-toggle {
      position: fixed;
      right: 68px;
      bottom: 14px;
      border: 0;
      border-radius: 999px;
      background: #ffffff;
      color: #2e3c54;
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(21, 34, 54, 0.14);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .duration-bar-toggle .material-symbols-outlined {
      font-size: 24px;
      line-height: 1;
    }

    .global-duration-bar-toggle {
      position: fixed;
      right: 120px;
      bottom: 14px;
      border: 0;
      border-radius: 999px;
      background: #ffffff;
      color: #2e3c54;
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(21, 34, 54, 0.14);
      transition: transform 120ms ease, box-shadow 120ms ease;
      z-index: 50;
    }

    .global-duration-bar-toggle .material-symbols-outlined {
      font-size: 24px;
      line-height: 1;
    }

    .map-toggle:hover:not(:disabled),
    .duration-bar-toggle:hover:not(:disabled),
    .global-duration-bar-toggle:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(21, 34, 54, 0.18);
    }

    .map-toggle:disabled,
    .duration-bar-toggle:disabled,
    .global-duration-bar-toggle:disabled {
      opacity: 0.5;

    const BG_PRESETS = {

      serif: { label: "Serif",      stack: 'Georgia, "Times New Roman", serif' },
      round: { label: "Rounded",    stack: '"Trebuchet MS", "Gill Sans", sans-serif' },

    };

    const ZOOM_LEVELS = [0.8, 0.9, 1, 1.1, 1.25, 1.5];
    const SETTINGS_DEFAULTS = { bg: "cloud", font: "sans", zoom: 1 };
    const SETTINGS_KEY = "slidedeckSettings";
    const EDITOR_DEBOUNCE_MS = 400;
    const BLOB_REVOKE_MS = 1000;
    const QR_DEFAULT_SIZE = 200;
    const appSettings = { ...SETTINGS_DEFAULTS };
    let delimiterAnchorEl = null;
    let zoomAnchorEl = null;

    function announceStatus(message) {
      if (!srStatusEl) {
        return;
      }
      srStatusEl.textContent = "";
      requestAnimationFrame(() => {
        srStatusEl.textContent = message;
      });
    }

    function escapeHtml(input) {
      return input
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    if (window.marked) {
      window.marked.setOptions({
        gfm: true,
        breaks: false,
        headerIds: false,
        mangle: false,
        html: true
      });

      window.marked.use({
        renderer: {
          del({ tokens }) {
            return `<span style="text-decoration:line-through;text-decoration-thickness:1px;">${this.parser.parseInline(tokens)}</span>`;
          },
          image({ href, title, text }) {
            const dimMatch = text && text.match(/^\|?(\d+)(?:x(\d+))?$/);
            if (dimMatch) {
              const [, w, h] = dimMatch;
              const style = h
                ? `width:${w}px;height:${h}px;object-fit:contain;`
                : `width:${w}px;`;
              const titleAttr = title ? ` title="${title}"` : "";
              return `<img src="${href}"${titleAttr} style="${style}" alt="">`;
            }
            const altAttr = text ? ` alt="${text}"` : "";
            const titleAttr = title ? ` title="${title}"` : "";
            return `<img src="${href}"${altAttr}${titleAttr}>`;
          }
        }
      });
    }

    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: false,
        securityLevel: "antiscript",
        theme: "default"
      });
    }

    function slugify(value) {
      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, "")
        .replace(/\s+/g, "-");
    }

    function parseDuration(str) {
      const s = String(str || "").trim().toLowerCase();
      const full = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
      if (full && (full[1] || full[2] || full[3])) {
        return (parseInt(full[1] || 0, 10) * 3600)
          + (parseInt(full[2] || 0, 10) * 60)
          + parseInt(full[3] || 0, 10);
      }
      const colon = s.match(/^(\d+):(\d{2})$/);
      if (colon) {
        return parseInt(colon[1], 10) * 60 + parseInt(colon[2], 10);
      }
      return null;
    }

    function formatDuration(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return s ? `${m}:${String(s).padStart(2, "0")}` : `${m}m`;
    }

    function extractFrontmatter(markdown) {
      const normalized = markdown.replace(/\r\n?/g, "\n");
      if (!normalized.startsWith("---\n")) {
        return { content: normalized, metadata: {} };
      }

      const endIndex = normalized.indexOf("\n---\n", 4);
      if (endIndex === -1) {
        return { content: normalized, metadata: {} };
      }

      const frontmatterText = normalized.slice(4, endIndex).trim();
      const body = normalized.slice(endIndex + 5);
      const metadata = {};
      frontmatterText.split("\n").forEach((line) => {
        const match = line.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
        if (match) {
          metadata[match[1]] = match[2].trim();
        }
      });
      return { content: body, metadata };
    }

    function markdownToHtml(markdown) {
      const normalized = markdown.replace(/\r\n?/g, "\n");
      if (window.marked && typeof window.marked.parse === "function") {
        return window.marked.parse(normalized);
      }
      return `<pre>${escapeHtml(normalized)}</pre>`;
    }

    function transformFootnotes(markdown) {
      const lines = markdown.split("\n");
      const definitions = {};
      const skip = new Set();
      let inCode = false;

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        if (/^```/.test(line.trim())) {
          inCode = !inCode;
          continue;
        }
        if (inCode) {
          continue;
        }

        const match = line.match(/^\[\^([^\]]+)\]:\s*(.*)$/);
        if (!match) {
          continue;
        }

        const id = match[1];
        const parts = [match[2]];
        skip.add(i);
        let j = i + 1;
        while (j < lines.length && (/^\s{2,}/.test(lines[j]) || /^\t/.test(lines[j]))) {
          parts.push(lines[j].replace(/^\s{1,4}/, ""));
          skip.add(j);
          j += 1;
        }
        definitions[id] = parts.join("\n").trim();
        i = j - 1;
      }

      const body = lines.filter((_, idx) => !skip.has(idx)).join("\n");
      const usedOrder = [];
      const textWithRefs = body.replace(/\[\^([^\]]+)\]/g, (full, id) => {
        if (!definitions[id]) {
          return full;
        }
        if (!usedOrder.includes(id)) {
          usedOrder.push(id);
        }
        const number = usedOrder.indexOf(id) + 1;
        const slug = slugify(id);
        return `<sup class="footnote-ref"><a href="#fn-${slug}" id="fnref-${slug}">${number}</a></sup>`;
      });

      if (!usedOrder.length) {
        return textWithRefs;
      }

      const items = usedOrder.map((id) => {
        const slug = slugify(id);
        const raw = definitions[id] || "";
        const rendered = window.marked && typeof window.marked.parseInline === "function"
          ? window.marked.parseInline(raw)
          : escapeHtml(raw);
        return `<li id="fn-${slug}">${rendered} <a href="#fnref-${slug}" aria-label="Back to reference">↩</a></li>`;
      }).join("");

      return `${textWithRefs}\n\n<section class="footnotes"><ol>${items}</ol></section>`;
    }

    function applyObsidianSyntax(markdown) {
      let text = markdown.replace(/\r\n?/g, "\n");

      // Obsidian comments
      text = text.replace(/%%[\s\S]*?%%/g, "");

      // Image embeds: ![[image.png]] or ![[image.png|W]] or ![[image.png|WxH]]
      text = text.replace(/!\[\[([^\]|]+?)(?:\|(\d+(?:x\d+)?))?\]\]/g, (_, filename, dim) => {
        const src = filename.trim();
        if (!dim) return `<img src="${src}" alt="${src.replace(/"/g, "&quot;")}">`;
        const [w, h] = dim.split("x");
        const style = h ? `width:${w}px;height:${h}px;object-fit:contain;` : `width:${w}px;`;
        return `<img src="${src}" alt="" style="${style}">`;
      });

      // Internal anchors: [[Note#Heading]] or [[#Heading]] (+ optional alias)
      text = text.replace(/\[\[(?:([^#\]|]+))?#([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, rawNote, rawHeading, rawAlias) => {
        const note = String(rawNote || "").trim();
        const heading = String(rawHeading || "").trim();
        const alias = String(rawAlias || heading).trim();
        const anchor = slugify(heading);
        const noteAttr = note ? ` data-note="${note.replace(/"/g, "&quot;")}"` : "";
        return `<a class="internal-anchor" href="#${anchor}"${noteAttr}>${alias}</a>`;
      });

      // ==highlight==
      text = text.replace(/==([^\n=][^=\n]*?)==/g, "<mark>$1</mark>");

      // x^2^ and H~2~ style markers
      text = text.replace(/\^([^\^\s][^\^]*?)\^/g, "<sup>$1</sup>");
      text = text.replace(/(?<!~)~([^~\s][^~]*?)~(?!~)/g, "<sub>$1</sub>");

      return transformFootnotes(text);
    }

    function splitSlidesByH1(content) {
      const lines = content.replace(/\r\n?/g, "\n").split("\n");
      const slides = [];
      let current = [];
      let inFence = false;
      let fenceChar = "";

      const pushCurrent = () => {
        const chunk = current.join("\n").trim();
        if (chunk) {
          slides.push(chunk);
        }
      };

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        const trimmed = line.trim();
        const fenceMatch = trimmed.match(/^(```+|~~~+)/);

        if (fenceMatch) {
          const marker = fenceMatch[1];
          const markerChar = marker[0];
          if (!inFence) {
            inFence = true;
            fenceChar = markerChar;
          } else if (fenceChar === markerChar) {
            inFence = false;
            fenceChar = "";
          }
          current.push(line);
          continue;
        }

        const isH1 = !inFence && /^\s{0,3}#\s+.+$/.test(line);
        if (isH1) {
          pushCurrent();
          current = [line];
          continue;
        }
        current.push(line);
      }

      pushCurrent();
      return slides;
    }

    function parseSlides(markdown) {
      const { content, metadata } = extractFrontmatter(markdown);
      state.frontmatter = metadata;
      const slideSplitMode = state.slideSplitMode === "h1" ? "h1" : "delimiter";
      const slideDelimiter = state.slideDelimiter || "---";
      const notesDelimiter = String(state.notesDelimiter || "");
      const slideEscaped = slideDelimiter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const splitRegex = new RegExp(`^${slideEscaped}\\s*$`, "m");
      const notesEscaped = notesDelimiter ? notesDelimiter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") : null;
      const notesRegex = notesEscaped
        ? new RegExp(`^${notesEscaped}\\s*$`, "m")
        : null;
      const notesDurationRegex = notesEscaped
        ? new RegExp(`^(${notesEscaped})[ \\t]+duration:\\s*([^\\n]*)$`, "im")
        : null;

      const rawSlides = slideSplitMode === "h1"
        ? splitSlidesByH1(content)
        : content
          .split(splitRegex)
          .map((chunk) => chunk.trim())
          .filter(Boolean);

      return rawSlides.map((raw) => {
        let duration = null;
        const rawForSplit = notesDurationRegex
          ? raw.replace(notesDurationRegex, (_, delim, val) => {
              duration = parseDuration(val.trim());
              return delim;
            })
          : raw;

        const noteSeparator = notesRegex ? rawForSplit.split(notesRegex) : [rawForSplit];
        const content = noteSeparator[0].trim();
        const enhanced = applyObsidianSyntax(content);
        return {
          content,
          notes: noteSeparator.slice(1).join("\n").trim(),
          html: markdownToHtml(enhanced),
          duration
        };
      });
    }

    function decodeHtml(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      return tmp.textContent || "";
    }

    function buildGrid() {
      state.hiddenSections = new Set();
      state.hiddenSlides = new Set();
      if (!state.slides.length) { state.grid = []; state.col = 0; state.row = 0; return; }
      const columns = [];
      let col = [];
      state.slides.forEach((slide, idx) => {
        if (idx > 0 && /^<h1[\s>]/i.test(slide.html.trimStart())) {
          columns.push(col);
          col = [];
        }
        col.push(idx);
      });
      columns.push(col);
      state.grid = columns;
      state.grid.forEach((colSlides, colIdx) => {
        for (const si of colSlides) {
          const content = state.slides[si].content;
          if (/^#[^#\n].* --\s*$/m.test(content)) {
            state.hiddenSections.add(colIdx);
            break;
          }
        }
        colSlides.slice(1).forEach(si => {
          if (/^#{2,}\s.* --\s*$/m.test(state.slides[si].content)) {
            state.hiddenSlides.add(si);
          }
        });
      });
      syncGridFromIndex();
    }

    function syncGridFromIndex() {
      for (let c = 0; c < state.grid.length; c++) {
        const r = state.grid[c].indexOf(state.index);
        if (r !== -1) { state.col = c; state.row = r; return; }
      }
      state.col = 0; state.row = 0;
    }

    function syncIndexFromGrid() {
      const col = state.grid[state.col];
      if (!col) return;
      state.row = Math.max(0, Math.min(state.row, col.length - 1));
      state.index = col[state.row];
    }

    function assignHeadingIds() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        return;
      }
      const seen = new Map();
      contentRoot.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((heading) => {
        if (heading.id) {
          return;
        }
        const base = slugify(heading.textContent || "section") || "section";
        const count = seen.get(base) || 0;
        seen.set(base, count + 1);
        heading.id = count ? `${base}-${count + 1}` : base;
      });
    }

    function cleanObsidianCallouts() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        return;
      }
      contentRoot.querySelectorAll("blockquote").forEach((bq) => {
        const p = bq.querySelector("p");
        if (!p) return;
        const text = p.textContent;
        const match = text.match(/^\[!(\w+)\]\s+(.+?)(?:\n|$)/);
        if (match) {
          const type = match[1].toLowerCase();
          const title = match[2];
          const rest = text.substring(match[0].length).trim();
          bq.classList.add("callout", `callout-${type}`);

          // Create header with title
          const header = document.createElement("div");
          header.className = "callout-title";
          header.textContent = title;

          // Update paragraph with just the content
          p.textContent = rest;

          // Insert header before paragraph
          bq.insertBefore(header, p);
        }
      });
    }

    function configureEmbeds() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        return;
      }

      const iframes = Array.from(contentRoot.querySelectorAll("iframe"));
      const isFileProtocol = window.location.protocol === "file:";
      let hasYouTubeEmbed = false;

      iframes.forEach((iframe) => {
        const rawSrc = iframe.getAttribute("src") || "";
        if (!rawSrc) {
          return;
        }

        let url;
        try {
          url = new URL(rawSrc, window.location.href);
        } catch {
          return;
        }

        const host = url.hostname.toLowerCase();
        const isYouTube =
          host.includes("youtube.com") ||
          host.includes("youtu.be") ||
          host.includes("youtube-nocookie.com");

        if (!isYouTube) {
          return;
        }

        hasYouTubeEmbed = true;
        iframe.referrerPolicy = "origin-when-cross-origin";
        iframe.setAttribute("allowfullscreen", "");

        if (window.location.protocol.startsWith("http") && !url.searchParams.get("origin")) {
          url.searchParams.set("origin", window.location.origin);
        }

        if (host.includes("youtube.com") && !host.includes("youtube-nocookie.com")) {
          url.hostname = "www.youtube-nocookie.com";
        }

        iframe.src = url.toString();
      });

      if (isFileProtocol && hasYouTubeEmbed) {
        const warning = document.createElement("div");
        warning.className = "embed-warning";
        warning.textContent = "YouTube embed may fail in file:// mode (Error 153). Serve this app over http://localhost to enable it.";
        contentRoot.appendChild(warning);
      }
    }

    function enhanceMediaAccessibility() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        return;
      }

      const iframes = Array.from(contentRoot.querySelectorAll("iframe"));
      iframes.forEach((iframe, index) => {
        if (!iframe.getAttribute("title")) {
          iframe.setAttribute("title", `Embedded media ${index + 1}`);
        }
      });

      const videos = Array.from(contentRoot.querySelectorAll("video"));
      videos.forEach((video, index) => {
        video.setAttribute("controls", "");
        if (!video.getAttribute("aria-label") && !video.getAttribute("title")) {
          video.setAttribute("aria-label", `Video ${index + 1}`);
        }

        const hasTrack = video.querySelector("track[kind='captions'], track[kind='subtitles']");
        if (!hasTrack) {
          const warning = document.createElement("div");
          warning.className = "media-warning";
          warning.textContent = "No captions or subtitles track detected for this video.";
          video.insertAdjacentElement("afterend", warning);
        }
      });
    }

    function enhanceCallouts() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        return;
      }

      const calloutTypeMap = {
        abstract: "info",
        summary: "info",
        tldr: "info",
        info: "info",
        todo: "note",
        note: "note",
        hint: "tip",
        important: "tip",
        tip: "tip",
        success: "success",
        check: "success",
        done: "success",
        question: "question",
        help: "question",
        faq: "question",
        warning: "warning",
        caution: "warning",
        attention: "warning",
        failure: "danger",
        fail: "danger",
        missing: "danger",
        danger: "danger",
        error: "danger",
        bug: "danger",
        example: "example",
        quote: "quote"
      };

      const blockquotes = Array.from(contentRoot.querySelectorAll("blockquote"));
      blockquotes.forEach((blockquote) => {
        const firstLineNode = blockquote.querySelector("p, div");
        if (!firstLineNode) {
          return;
        }

        const firstLineText = String(firstLineNode.textContent || "")
          .split(/\r?\n/)[0]
          .trim();
        const match = firstLineText.match(/^\s*\[!([A-Za-z-]+)\]([+-])?\s*(.*)$/i);
        if (!match) {
          return;
        }

        const rawType = match[1].toLowerCase();
        const type = calloutTypeMap[rawType] || rawType;
        const fold = match[2] || "";
        const customTitle = (match[3] || "").trim();
        const titleText = customTitle || type;

        blockquote.classList.add("callout", `callout-${type}`);
        if (fold) {
          blockquote.classList.add("is-foldable");
          if (fold === "-") {
            blockquote.classList.add("is-collapsed");
          }
        }

        const title = document.createElement("div");
        title.className = "callout-title";
        title.textContent = titleText;

        if (blockquote.firstElementChild === firstLineNode) {
          blockquote.insertBefore(title, firstLineNode);
        } else {
          blockquote.prepend(title);
        }

        const firstHtml = firstLineNode.innerHTML.replace(/^\s*\[![A-Za-z-]+\][+-]?\s*/i, "");
        if (firstHtml.trim()) {
          firstLineNode.innerHTML = firstHtml;
        } else {
          firstLineNode.remove();
        }

        if (fold) {
          title.setAttribute("tabindex", "0");
          title.setAttribute("role", "button");
          title.setAttribute("aria-expanded", String(!blockquote.classList.contains("is-collapsed")));
          title.addEventListener("click", () => {
            blockquote.classList.toggle("is-collapsed");
            title.setAttribute("aria-expanded", String(!blockquote.classList.contains("is-collapsed")));
          });
          title.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              blockquote.classList.toggle("is-collapsed");
              title.setAttribute("aria-expanded", String(!blockquote.classList.contains("is-collapsed")));
            }
          });
        }
      });
    }

    function renderMath() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot || typeof window.renderMathInElement !== "function") {
        return;
      }

      window.renderMathInElement(contentRoot, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });

    function clearSearchHighlights() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        return;
      }
      const marks = Array.from(contentRoot.querySelectorAll("mark.search-hit"));
      marks.forEach((mark) => {
        const parent = mark.parentNode;
        if (!parent) {
          return;
        }
        parent.replaceChild(document.createTextNode(mark.textContent || ""), mark);
        parent.normalize();
      });
    }

    function updateSearchCount() {
      if (!searchCountEl) {
        return;
      }
      const total = state.search.results.length;
      if (!state.search.query.trim() || total === 0 || state.search.activeIndex < 0) {
        searchCountEl.textContent = "0 / 0";
        return;
      }
      searchCountEl.textContent = `${state.search.activeIndex + 1} / ${total}`;
    }

    function applySearchHighlights() {
      clearSearchHighlights();

      const query = state.search.query.trim();
      if (!query) {
        updateSearchCount();
        return;
      }

      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        updateSearchCount();
        return;
      }

      const active = state.search.results[state.search.activeIndex];
      const activeOccurrence = active && active.slideIndex === state.index ? active.occurrence : -1;
      const qLower = query.toLowerCase();
      let occurrence = 0;
      let activeMark = null;

      const walker = document.createTreeWalker(contentRoot, NodeFilter.SHOW_TEXT);
      const targets = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        const parent = node.parentElement;
        if (!parent) {
          continue;
        }
        if (parent.closest("script, style, pre, code, .katex, .mermaid, svg, math, textarea")) {
          continue;
        }
        if ((node.nodeValue || "").toLowerCase().includes(qLower)) {
          targets.push(node);
        }
      }

      targets.forEach((node) => {
        const text = node.nodeValue || "";
        const lower = text.toLowerCase();
        let cursor = 0;
        let idx = lower.indexOf(qLower, cursor);
        if (idx === -1) {
          return;
        }

        const frag = document.createDocumentFragment();
        while (idx !== -1) {
          if (idx > cursor) {
            frag.appendChild(document.createTextNode(text.slice(cursor, idx)));
          }
          const mark = document.createElement("mark");
          mark.className = "search-hit";
          mark.textContent = text.slice(idx, idx + query.length);
          occurrence += 1;
          if (occurrence === activeOccurrence) {
            mark.classList.add("is-active");
            activeMark = mark;
          }
          frag.appendChild(mark);
          cursor = idx + query.length;
          idx = lower.indexOf(qLower, cursor);
        }

        if (cursor < text.length) {
          frag.appendChild(document.createTextNode(text.slice(cursor)));
        }
        node.parentNode.replaceChild(frag, node);
      });

      if (activeMark) {
        activeMark.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
      updateSearchCount();
    }

    function setSearchPanelOpen(open) {
      state.search.panelOpen = open;

    function buildDelimiterGuideHTML(slideMode, slideDelimiter, notesDelimiter) {
      const isH1 = slideMode === "h1";
      const notesDel = escapeHtml(notesDelimiter || "--");
      const slideDel = escapeHtml(slideDelimiter || "---");

      const exampleText = isH1
        ? `# Slide title        \u2190 each H1 starts a new slide\n\nContent here\u2026\n\n${notesDel} duration: 2m      \u2190 notes delimiter + optional duration\nSpeaker notes\u2026\n\n# Next slide\u2026`
        : `Slide title\n\nContent here\u2026\n\n${notesDel} duration: 2m      \u2190 notes delimiter + optional duration\nSpeaker notes\u2026\n\n${slideDel}\n\nNext slide\u2026`;

      const slideRule = isH1
        ? `<li><code># H1</code> starts a new slide</li>`
        : `<li><code>${slideDel}</code> separates slides</li>`;

      return `
        <div class="delimiter-section-title">Markdown format reference</div>
        <pre class="delimiter-guide-pre">${exampleText}</pre>
        <ul class="delimiter-guide-legend">
          ${slideRule}
          <li><code>${notesDel}</code> separates slide content from speaker notes</li>
          <li><code>${notesDel} duration: 2m</code> adds a timed duration <em>(e.g. 30s, 1m30s, 2:00)</em></li>
        </ul>
      `;
    }

    function clampZoomLevel(value) {
      return ZOOM_LEVELS.includes(value) ? value : SETTINGS_DEFAULTS.zoom;
    }

    function getCurrentZoomIndex() {
      return ZOOM_LEVELS.indexOf(appSettings.zoom);
    }

    function updateZoomUI() {
      const zoomPercent = Math.round(appSettings.zoom * 100);
      if (zoomValueEl) {
        zoomValueEl.textContent = `${zoomPercent}%`;
      }
      if (zoomToggleEl) {
        zoomToggleEl.title = `Slide zoom (${zoomPercent}%)`;
        zoomToggleEl.setAttribute("aria-label", `Slide zoom (${zoomPercent}%)`);
      }
      if (zoomOutEl) {
        zoomOutEl.disabled = getCurrentZoomIndex() <= 0;
      }
      if (zoomInEl) {
        zoomInEl.disabled = getCurrentZoomIndex() >= ZOOM_LEVELS.length - 1;
      }
      if (zoomResetEl) {
        zoomResetEl.disabled = appSettings.zoom === SETTINGS_DEFAULTS.zoom;
      }
    }

    function applyZoomToCurrentSlide() {
      const contentEl = slideEl.querySelector(".slide-content");
      if (contentEl) {
        contentEl.style.zoom = String(appSettings.zoom);
      }
      updateZoomUI();
      updateSlideAlignment();
    }

    function stepZoom(direction) {
      const currentIndex = getCurrentZoomIndex();
      if (currentIndex === -1) {
        return;
      }
      const nextIndex = Math.min(Math.max(currentIndex + direction, 0), ZOOM_LEVELS.length - 1);
      if (nextIndex !== currentIndex) {
        applySettings({ ...appSettings, zoom: ZOOM_LEVELS[nextIndex] });
        announceStatus(`Zoom ${Math.round(appSettings.zoom * 100)} percent.`);
      }
    }

    function resetZoom() {
      if (appSettings.zoom === SETTINGS_DEFAULTS.zoom) {
        return;
      }
      applySettings({ ...appSettings, zoom: SETTINGS_DEFAULTS.zoom });
      announceStatus("Zoom 100 percent.");
    }

    function applySettings({ bg, font, zoom }) {
      const bgPreset = BG_PRESETS[bg] || BG_PRESETS.cloud;
      const fontPreset = FONT_PRESETS[font] || FONT_PRESETS.sans;
      const root = document.documentElement.style;
      root.setProperty("--bg-a", bgPreset.a);
      root.setProperty("--bg-b", bgPreset.b);
      root.setProperty("--slide-font", fontPreset.stack);
      appSettings.bg = bg;
      appSettings.font = font;
      appSettings.zoom = clampZoomLevel(zoom);
      saveSettings();
      renderSettingsUI();
      applyZoomToCurrentSlide();
    }

    function saveSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          bg: appSettings.bg,
          font: appSettings.font,
          zoom: appSettings.zoom
        }));
      } catch (err) {
        console.warn("Settings save error:", err);
      }
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.bg && BG_PRESETS[parsed.bg])     appSettings.bg   = parsed.bg;
          if (parsed.font && FONT_PRESETS[parsed.font]) appSettings.font = parsed.font;
          if (typeof parsed.zoom === "number") appSettings.zoom = clampZoomLevel(parsed.zoom);
        }
      } catch (err) {
        console.warn("Settings load error:", err);
      }
      applySettings(appSettings);
    }

    function renderDelimiterUI() {
      delimiterOptionEls.forEach((option) => {

        const activeSlide = delimiterPanelEl.hidden ? state.slideDelimiter : delimiterDraft.slide;

        } else {
          delimiterGuideEl.innerHTML = buildDelimiterGuideHTML(
            delimiterDraft.slideMode,
            delimiterDraft.slide,
            delimiterDraft.notes
          );
        }
      }
    }

    function positionDelimiterPanel(anchorEl) {
      if (!delimiterPanelEl || !anchorEl || delimiterPanelEl.hidden) {
        return;
      }

      const rect = anchorEl.getBoundingClientRect();
      const panelRect = delimiterPanelEl.getBoundingClientRect();
      const margin = 12;
      const gap = 14;
      let left = rect.left;
      let top = rect.bottom + gap;

      const maxLeft = Math.max(margin, window.innerWidth - panelRect.width - margin);
      left = Math.min(Math.max(margin, left), maxLeft);

      const overBottom = top + panelRect.height > window.innerHeight - margin;
      if (overBottom) {
        top = rect.top - panelRect.height - gap;
      }
      top = Math.max(margin, top);

      delimiterPanelEl.style.left = `${Math.round(left)}px`;
      delimiterPanelEl.style.top = `${Math.round(top)}px`;
    }

    function setDelimiterPanelOpen(open, anchorEl = null) {
      delimiterPanelEl.hidden = !open;
      if (open) {
        delimiterDraft.slideMode = state.slideSplitMode;
        delimiterDraft.slide = state.slideDelimiter;
        delimiterDraft.notes = state.notesDelimiter;
        delimiterAnchorEl = anchorEl || document.querySelector("[data-action='delimiter-toggle']");
      }
      renderDelimiterUI();
      if (open) {
        positionDelimiterPanel(delimiterAnchorEl);
      }
      if (delimiterToggleEl) {
        delimiterToggleEl.setAttribute("aria-expanded", String(open));
      }
      const inlineToggles = Array.from(document.querySelectorAll("[data-action='delimiter-toggle']"));
      inlineToggles.forEach((toggle) => {
        toggle.setAttribute("aria-expanded", String(open));
      });
    }

    function applyDelimiters(slideMode, slideDelimiter, notesDelimiter, announce = true) {
      const nextMode = slideMode === "h1" ? "h1" : "delimiter";
      const nextSlide = String(slideDelimiter || "").trim();
      if (nextMode === "delimiter" && !nextSlide) {
        announceStatus("Slide delimiter cannot be empty.");
        return false;
      }
      state.slideSplitMode = nextMode;
      if (nextSlide) {
        state.slideDelimiter = nextSlide;
      }
      state.notesDelimiter = String(notesDelimiter || "").trim();
      if (state.sourceMarkdown) {
        state.slides = parseSlides(state.sourceMarkdown);
        buildGrid();
        state.index = Math.min(state.index, Math.max(0, state.slides.length - 1));
        syncGridFromIndex();
      }
      renderSlide();
      if (announce) {
        const notesMarker = state.notesDelimiter || "none";
        if (state.slideSplitMode === "h1") {
          announceStatus(`Delimiters applied. Slide mode: H1 headings. Notes: ${notesMarker}.`);
        } else {
          announceStatus(`Delimiters applied. Slide mode: delimiter (${state.slideDelimiter}). Notes: ${notesMarker}.`);
        }
      }
      return true;
    }

    function rebuildSearchResults() {
      const query = state.search.query.trim().toLowerCase();
      state.search.results = [];
      state.search.activeIndex = -1;

      if (!query || !state.slides.length) {
        applySearchHighlights();
        return;
      }

      state.slides.forEach((slide, slideIndex) => {
        const text = String(slide.content || "").toLowerCase();
        let from = 0;
        let occurrence = 0;
        let at = text.indexOf(query, from);
        while (at !== -1) {
          occurrence += 1;
          state.search.results.push({ slideIndex, occurrence });
          from = at + query.length;
          at = text.indexOf(query, from);
        }
      });

      if (!state.search.results.length) {
        applySearchHighlights();
        announceStatus("No search results.");
        return;
      }

      const currentSlideResult = state.search.results.findIndex((item) => item.slideIndex === state.index);
      state.search.activeIndex = currentSlideResult >= 0 ? currentSlideResult : 0;
      goToSearchResult(state.search.activeIndex, false);
    }

    function goToSearchResult(index, announce = true) {
      const total = state.search.results.length;
      if (!total) {
        state.search.activeIndex = -1;
        updateSearchCount();
        return;
      }

      const nextIndex = ((index % total) + total) % total;
      state.search.activeIndex = nextIndex;
      const target = state.search.results[nextIndex];
      if (!target) {
        updateSearchCount();
        return;
      }

      if (state.index !== target.slideIndex) {
        state.index = target.slideIndex;
        syncGridFromIndex();
        renderSlide();
      } else {
        applySearchHighlights();
      }

      if (announce) {
        announceStatus(`Match ${nextIndex + 1} of ${total}, slide ${target.slideIndex + 1}.`);
      }
    }

    function goToNextSearchResult() {
      goToSearchResult(state.search.activeIndex + 1);
    }

    function goToPreviousSearchResult() {
      goToSearchResult(state.search.activeIndex - 1);
    }

    function enhanceTags() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        return;
      }

      const walker = document.createTreeWalker(contentRoot, NodeFilter.SHOW_TEXT);
      const targets = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        const parent = node.parentElement;
        if (!parent) {
          continue;
        }
        if (parent.closest("pre, code, a, script, style, .katex, .mermaid")) {
          continue;
        }
        if (/(^|\s)#[A-Za-z][\w/-]*/.test(node.textContent || "")) {
          targets.push(node);
        }
      }

      targets.forEach((node) => {
        const text = node.textContent || "";
        const frag = document.createDocumentFragment();
        const regex = /(^|\s)(#[A-Za-z][\w/-]*)/g;
        let last = 0;
        let match;
        while ((match = regex.exec(text)) !== null) {
          const index = match.index;
          const leading = match[1] || "";
          const tag = match[2];
          const preText = text.slice(last, index);
          if (preText) {
            frag.appendChild(document.createTextNode(preText));
          }
          if (leading) {
            frag.appendChild(document.createTextNode(leading));
          }
          const span = document.createElement("span");
          span.className = "md-tag";
          span.textContent = tag;
          frag.appendChild(span);
          last = index + leading.length + tag.length;
        }
        const tail = text.slice(last);
        if (tail) {
          frag.appendChild(document.createTextNode(tail));
        }
        node.parentNode.replaceChild(frag, node);
      });
    }

    async function renderMermaid() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot || !window.mermaid) {
        return;
      }

      const blocks = Array.from(contentRoot.querySelectorAll("pre > code.language-mermaid"));
      blocks.forEach((code, idx) => {
        const pre = code.parentElement;
        if (!pre) {
          return;
        }
        const container = document.createElement("div");
        container.className = "mermaid";
        container.id = `mermaid-${state.index}-${idx}`;
        container.textContent = code.textContent || "";
        pre.replaceWith(container);
      });

      if (blocks.length) {
        try {
          await window.mermaid.run({ querySelector: ".mermaid" });
        } catch {
          // Keep raw text already visible inside .mermaid container.
        }
        updateSlideAlignment();
      }
    }

    function executeInlineScripts() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot) {
        return;
      }
      Array.from(contentRoot.querySelectorAll("script")).forEach((oldScript) => {
        const src = oldScript.getAttribute("src");
        // Skip re-fetching QRCode.js CDN if already loaded
        if (src && src.includes("qrcode") && typeof window.QRCode === "function") {
          oldScript.remove();
          return;
        }
        const newScript = document.createElement("script");
        Array.from(oldScript.attributes).forEach((attr) => {
          newScript.setAttribute(attr.name, attr.value);
        });
        newScript.textContent = oldScript.textContent;
        oldScript.replaceWith(newScript);
      });
    }

    function renderQRCodes() {
      const contentRoot = slideEl.querySelector(".slide-content");
      if (!contentRoot || typeof window.QRCode !== "function") {
        return;
      }

      // ![qr](https://url) or ![qr 200](https://url) syntax
      contentRoot.querySelectorAll('img[alt^="qr" i]').forEach((img) => {
        const url = img.getAttribute("src");
        if (!url) {
          return;
        }
        const sizeMatch = (img.getAttribute("alt") || "").match(/\d+/);
        const size = sizeMatch ? parseInt(sizeMatch[0], 10) : (parseInt(img.getAttribute("width") || "0", 10) || QR_DEFAULT_SIZE);
        const wrapper = document.createElement("div");
        wrapper.className = "qr-code-generated";
        img.replaceWith(wrapper);
        new window.QRCode(wrapper, {
          text: url,
          width: size,
          height: size,
          correctLevel: window.QRCode.CorrectLevel.H
        });
      });

      // <div data-qr="https://url" data-size="200"></div> syntax
      contentRoot.querySelectorAll("div[data-qr]").forEach((div) => {
        const url = div.getAttribute("data-qr");
        if (!url || div.querySelector("canvas, img")) {
          return;
        }
        const size = parseInt(div.getAttribute("data-size") || String(QR_DEFAULT_SIZE), 10);
        new window.QRCode(div, {
          text: url,
          width: size,
          height: size,
          correctLevel: window.QRCode.CorrectLevel.H
        });
      });
    }

      }

      if (appTitleEl) {

        appEl.classList.remove("show-footer");

      state.slideStartedAt = Date.now();
      slideEl.innerHTML = `
        <div class="slide-center">

        </div>
      `;
      applyZoomToCurrentSlide();
      assignHeadingIds();
      cleanObsidianCallouts();
      configureEmbeds();
      enhanceMediaAccessibility();
      enhanceCallouts();
      enhanceTags();
      renderMath();
      renderMermaid();
      renderQRCodes();
      executeInlineScripts();

      updateSlideAlignment();
      slideEl.scrollTop = 0;
      renderTrainMap();
      renderDurationBar();
      renderNavArrows();
      renderVerticalNav();

      // Chevron hint on title-only slides
      const currentSlide = state.slides[state.index];
      const isTitleOnly = /^#{1,6}\s+\S[^\n]*$/.test(currentSlide.content.trim());
      const hasNext = state.index < state.slides.length - 1;
      const colHasSubslides = (state.grid[state.col]?.length ?? 0) > 1;
      if (isTitleOnly && hasNext && !colHasSubslides) {
        const centerEl = slideEl.querySelector(".slide-center");
        if (centerEl) {
          const hint = document.createElement("div");
          hint.className = "slide-continue-hint";
          hint.setAttribute("aria-hidden", "true");
          hint.innerHTML = '<span class="material-symbols-outlined">chevron_right</span>';
          centerEl.appendChild(hint);
        }
      }

      if (overviewToggleEl) overviewToggleEl.hidden = state.grid.length <= 1;
      if (state.grid.length > 1) {
        announceStatus(`Section ${state.col + 1} of ${state.grid.length}, slide ${state.row + 1} of ${state.grid[state.col].length}`);
      } else {
        announceStatus(`Slide ${state.index + 1} of ${state.slides.length}`);
      }
      updateSectionTitleBar();
    }

    function updateSectionTitleBar() {
      if (!state.showSectionTitle || !state.grid || state.grid.length <= 1) {
        sectionTitleBarEl.hidden = true;
        return;
      }
      const firstIdx = state.grid[state.col][0];
      const html = state.slides[firstIdx]?.html || "";
      const h1Match = html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
      const title = h1Match ? decodeHtml(h1Match[1]) : "";
      sectionTitleTextEl.textContent = title;
      sectionTitleBarEl.hidden = !title;
    }

    function updateSlideAlignment() {
      const centerEl = slideEl.querySelector(".slide-center");
      const contentEl = slideEl.querySelector(".slide-content");
      if (!centerEl || !contentEl) {
        slideEl.classList.remove("is-tall");
        return;
      }

      const styles = window.getComputedStyle(centerEl);
      const padTop = parseFloat(styles.paddingTop) || 0;
      const padBottom = parseFloat(styles.paddingBottom) || 0;
      const availableHeight = slideEl.clientHeight - padTop - padBottom;
      const contentHeight = contentEl.getBoundingClientRect().height;
      slideEl.classList.toggle("is-tall", contentHeight > availableHeight);
    }

    function nextVisibleCol(from) {
      for (let c = from + 1; c < state.grid.length; c++) {
        if (!state.hiddenSections.has(c)) return c;
      }
      return -1;
    }

    function prevVisibleCol(from) {
      for (let c = from - 1; c >= 0; c--) {
        if (!state.hiddenSections.has(c)) return c;
      }
      return -1;
    }

    function nextVisibleRow(colIdx, fromRow) {
      const colSlides = state.grid[colIdx];
      for (let r = fromRow + 1; r < colSlides.length; r++) {
        if (!state.hiddenSlides.has(colSlides[r])) return r;
      }
      return -1;
    }

    function prevVisibleRow(colIdx, fromRow) {
      const colSlides = state.grid[colIdx];
      for (let r = fromRow - 1; r >= 0; r--) {
        if (!state.hiddenSlides.has(colSlides[r])) return r;
      }
      return -1;
    }

    function firstVisibleRow(colIdx) {
      const colSlides = state.grid[colIdx];
      for (let r = 0; r < colSlides.length; r++) {
        if (!state.hiddenSlides.has(colSlides[r])) return r;
      }
      return 0;
    }

    function lastVisibleRow(colIdx) {
      const colSlides = state.grid[colIdx];
      for (let r = colSlides.length - 1; r >= 0; r--) {
        if (!state.hiddenSlides.has(colSlides[r])) return r;
      }
      return colSlides.length - 1;
    }

    function goNext() {
      if (!state.grid.length) { if (state.index < state.slides.length - 1) { state.index++; renderSlide(); } return; }
      const nr = nextVisibleRow(state.col, state.row);
      if (nr !== -1) { state.row = nr; }
      else { const nc = nextVisibleCol(state.col); if (nc === -1) return; state.col = nc; state.row = firstVisibleRow(nc); }
      syncIndexFromGrid(); renderSlide();
    }

    function goPrev() {
      if (!state.grid.length) { if (state.index > 0) { state.index--; renderSlide(); } return; }
      const pr = prevVisibleRow(state.col, state.row);
      if (pr !== -1) { state.row = pr; }
      else { const pc = prevVisibleCol(state.col); if (pc === -1) return; state.col = pc; state.row = lastVisibleRow(pc); }
      syncIndexFromGrid(); renderSlide();
    }

    function goRight() {
      if (!state.grid.length) return;
      const nc = nextVisibleCol(state.col);
      if (nc === -1) return;
      state.col = nc; state.row = firstVisibleRow(nc);
      syncIndexFromGrid(); renderSlide();
    }

    function goLeft() {
      if (!state.grid.length) return;
      const pc = prevVisibleCol(state.col);
      if (pc === -1) return;
      state.col = pc; state.row = firstVisibleRow(pc);
      syncIndexFromGrid(); renderSlide();
    }

    function goDown() {
      if (!state.grid.length) return;
      const nr = nextVisibleRow(state.col, state.row);
      if (nr === -1) return;
      state.row = nr; syncIndexFromGrid(); renderSlide();
    }

    function goUp() {
      if (!state.grid.length) return;
      const pr = prevVisibleRow(state.col, state.row);
      if (pr === -1) return;
      state.row = pr; syncIndexFromGrid(); renderSlide();
    }

    function renderOverview() {
      if (!overviewEl) return;
      overviewEl.innerHTML = "";

      const hint = document.createElement("div");
      hint.className = "overview-hint";
      hint.textContent = "Click a slide to jump — press O or Esc to close";
      overviewEl.appendChild(hint);

      const grid = document.createElement("div");
      grid.className = "overview-grid";

      state.grid.forEach((column, colIdx) => {
        const colEl = document.createElement("div");
        colEl.className = "overview-col";

        const h1Match = (state.slides[column[0]]?.html || "").match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
        const title = h1Match ? decodeHtml(h1Match[1]) : `Section ${colIdx + 1}`;
        const titleEl = document.createElement("div");
        titleEl.className = "overview-col-title";
        titleEl.textContent = title;
        titleEl.title = title;
        colEl.appendChild(titleEl);

        column.forEach((flatIdx, rowIdx) => {
          const slide = state.slides[flatIdx];
          const isActive = colIdx === state.col && rowIdx === state.row;

          const card = document.createElement("div");
          card.className = "overview-card" + (isActive ? " active" : "");
          card.setAttribute("aria-label", `${title}, slide ${rowIdx + 1}`);

          const inner = document.createElement("div");
          inner.className = "overview-card-inner";
          inner.innerHTML = slide.html || "";
          card.appendChild(inner);

          const num = document.createElement("div");
          num.className = "overview-card-num";
          num.textContent = `${colIdx + 1}.${rowIdx + 1}`;
          card.appendChild(num);

          card.addEventListener("click", () => {
            state.col = colIdx;
            state.row = rowIdx;
            syncIndexFromGrid();
            closeOverview();
            renderSlide();
          });

          colEl.appendChild(card);
        });

        grid.appendChild(colEl);
      });

      overviewEl.appendChild(grid);
    }

    function openOverview() {
      if (!state.slides.length || !state.grid.length) return;
      state.overviewOpen = true;

      overviewToggleEl?.classList.add("active");
      overviewToggleEl?.setAttribute("aria-pressed", "true");

    function closeOverview() {
      state.overviewOpen = false;
      overviewEl.hidden = true;
      overviewToggleEl?.classList.remove("active");
      overviewToggleEl?.setAttribute("aria-pressed", "false");
    }

    function toggleOverview() {
      if (state.overviewOpen) closeOverview();

    async function triggerPlaylistLoad() {
      if (playlistErrorEl) playlistErrorEl.hidden = true;
      let urls = [];
      if (playlistTabMode === "url") {
        const src = (playlistUrlInputEl?.value || "").trim();
        if (!src) { showPlaylistError("Please enter a URL."); return; }
        if (playlistLoadBtnEl) { playlistLoadBtnEl.disabled = true; playlistLoadBtnEl.textContent = "Fetching playlist…"; }
        try {
          urls = await fetchPlaylistFromUrl(src);
        } catch (err) {
          showPlaylistError("Could not fetch playlist: " + (err.message || err));
          if (playlistLoadBtnEl) { playlistLoadBtnEl.disabled = false; playlistLoadBtnEl.textContent = "Pre-load All"; }
          return;
        }
        if (!urls.length) { showPlaylistError("No slide deck URLs found in that file."); if (playlistLoadBtnEl) { playlistLoadBtnEl.disabled = false; playlistLoadBtnEl.textContent = "Pre-load All"; } return; }
      } else {
        urls = (playlistTextareaEl?.value || "").split("\n").map(l => l.trim()).filter(l => /^https?:\/\//.test(l));
        if (!urls.length) { showPlaylistError("Enter at least one https:// URL."); return; }
      }
      if (playlistLoadBtnEl) { playlistLoadBtnEl.disabled = false; playlistLoadBtnEl.textContent = "Pre-load All"; }
      setPlaylistPanelOpen(false);
      await loadPlaylist(urls);
    }

    function showPlaylistError(msg) {
      if (!playlistErrorEl) return;
      playlistErrorEl.textContent = msg;
      playlistErrorEl.hidden = false;

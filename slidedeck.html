    // Per-session cache of Obsidian Publish file name maps (uid → Map<filename, vaultPath>)
    const _obsidianFileNameMaps = new Map();

    async function getObsidianFileNameMap(uid) {
      if (_obsidianFileNameMaps.has(uid)) return _obsidianFileNameMaps.get(uid);
      try {
        const resp = await fetch(`https://publish-01.obsidian.md/cache/${uid}`);
        if (!resp.ok) { _obsidianFileNameMaps.set(uid, null); return null; }
        const cache = await resp.json();
        const nameMap = new Map();
        for (const vaultPath of Object.keys(cache)) {
          if (!vaultPath.endsWith(".md")) continue;
          const segs = vaultPath.split("/");
          const filename = segs[segs.length - 1].replace(/\.md$/i, "");
          if (!nameMap.has(filename)) nameMap.set(filename, vaultPath.replace(/\.md$/i, ""));
        }
        _obsidianFileNameMaps.set(uid, nameMap);
        return nameMap;
      } catch { _obsidianFileNameMaps.set(uid, null); return null; }
    }

    async function fetchPlaylistFromUrl(playlistUrl) {
      const parsedPlaylist = new URL(playlistUrl);
      const pathParts = parsedPlaylist.pathname.replace(/^\//, "").split("/");
      const siteSlug = pathParts[0];
      const fileSegments = pathParts.slice(1).map(s => decodeURIComponent(s.replace(/\+/g, " ")));
      const fileDir = fileSegments.slice(0, -1);

      const isObsidian = /^https:\/\/publish\.obsidian\.md\//.test(playlistUrl);
      let fetchUrl = isObsidian ? await resolveObsidianPublishUrl(playlistUrl) : playlistUrl;

      // Fetch vault file-name map so wiki links can be resolved vault-wide
      let nameMap = null;
      if (isObsidian) {
        const pageHtml = await (await fetch(`https://publish.obsidian.md/${siteSlug}/`)).text();
        const uid = pageHtml.match(/["']uid["']\s*:\s*["']([a-f0-9]{32})["']/)?.[1];
        if (uid) nameMap = await getObsidianFileNameMap(uid);
      }

      const resp = await fetch(fetchUrl);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();

      const sameOriginPrefix = isObsidian ? `https://publish.obsidian.md/${siteSlug}/` : null;
      const urls = new Set();

      function toPublishUrl(rawPath) {
        const clean = rawPath.replace(/\.md$/i, "").trim();
        if (/^https?:\/\//.test(clean)) return clean;
        // Name-only wiki link (no slashes): resolve vault-wide via cache
        if (!clean.includes("/") && nameMap?.has(clean)) {
          const vaultPath = nameMap.get(clean);
          const encoded = vaultPath.split("/").map(s => encodeURIComponent(s)).join("/");
          return `https://publish.obsidian.md/${siteSlug}/${encoded}`;
        }
        // Partial path or fallback: resolve relative to playlist file's directory
        const segments = clean.includes("/") ? clean.split("/") : [...fileDir, clean];
        const encoded = segments.map(s => encodeURIComponent(s.trim())).join("/");
        return `https://publish.obsidian.md/${siteSlug}/${encoded}`;
      }

      function addUrl(url) {
        if (sameOriginPrefix && !url.startsWith(sameOriginPrefix)) return;
        urls.add(url);
      }

      const SKIP_LINE = /^\s*-\s+\[\s+\]/;
      for (const line of text.split("\n")) {
        if (SKIP_LINE.test(line)) continue;
        for (const m of line.matchAll(/https?:\/\/[^\s\)\]"'<]+/g)) addUrl(m[0]);
        for (const m of line.matchAll(/\[\[([^\]]+)\]\]/g)) addUrl(toPublishUrl(m[1].split("|")[0].trim()));
        for (const m of line.matchAll(/\[[^\]]*\]\(([^)]+)\)/g)) {
          const href = m[1].trim();
          if (/^https?:\/\//.test(href) || href.startsWith("#")) continue;
          addUrl(toPublishUrl(decodeURIComponent(href.replace(/\+/g, " "))));
        }
      }

      return [...urls];
    }

    function pageNameFromUrl(url) {
      try {
        const parts = new URL(url).pathname.split("/").filter(Boolean);
        return decodeURIComponent(parts[parts.length - 1]).replace(/\+/g, " ").replace(/\.md$/i, "");
      } catch { return url; }
    }

    function extractTitle(markdown) {
      const m = markdown.match(/^#\s+(.+)/m);
      return m ? m[1].trim() : "";
    }

    async function loadPlaylist(urls) {
      state.playlist = urls.map(url => ({ url, label: url, status: "loading", slides: null }));
      state.playlistIndex = -1;
      if (deckToggleEl) deckToggleEl.hidden = false;
      openDeckOverlay();

      await Promise.allSettled(urls.map(async (url, i) => {
        try {
          let fetchUrl = /^https:\/\/publish\.obsidian\.md\//.test(url)
            ? await resolveObsidianPublishUrl(url)
            : url;
          const resp = await fetch(fetchUrl);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const text = await resp.text();
          if (/does not exist|Not Found/i.test(text.slice(0, 200))) throw new Error("File not found");
          state.playlist[i].slides = parseSlides(text);
          state.playlist[i].label = extractTitle(text) || pageNameFromUrl(url);
          state.playlist[i].status = "ready";
        } catch {
          state.playlist[i].status = "error";
        }
        renderDeckOverlay();
      }));
    }

    function switchToDeck(i) {
      const entry = state.playlist[i];
      if (!entry || entry.status !== "ready") return;
      state.playlistIndex = i;
      state.slides = entry.slides;
      state.index = 0;
      state.col = 0;
      state.row = 0;
      buildGrid();
      renderSlide();
      closeDeckOverlay();
    }

    function renderDeckOverlay() {
      if (!deckOverlayEl) return;
      deckOverlayEl.innerHTML = "";

      const hint = document.createElement("div");
      hint.className = "deck-overlay-hint";
      hint.textContent = "Click a deck or press its number — D or Esc to close";
      deckOverlayEl.appendChild(hint);

      const grid = document.createElement("div");
      grid.className = "deck-grid";

      state.playlist.forEach((entry, i) => {
        const card = document.createElement("div");
        card.className = "deck-card " + entry.status + (i === state.playlistIndex ? " active" : "");
        card.setAttribute("tabindex", entry.status === "ready" ? "0" : "-1");
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `Deck ${i + 1}: ${entry.label}`);

        const num = document.createElement("div");
        num.className = "deck-card-num";
        num.textContent = `DECK ${i + 1}`;

        const status = document.createElement("div");
        status.className = "deck-card-status";
        status.textContent = entry.status === "ready" ? "✓" : entry.status === "error" ? "✗" : "⏳";

        const label = document.createElement("div");
        label.className = "deck-card-label";
        label.textContent = entry.status === "loading" ? "Loading…" : entry.status === "error" ? "Failed to load" : entry.label;

        card.appendChild(num);
        card.appendChild(status);
        card.appendChild(label);

        if (entry.status === "ready") {
          card.addEventListener("click", () => switchToDeck(i));
          card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); switchToDeck(i); } });
        }
        grid.appendChild(card);
      });

      deckOverlayEl.appendChild(grid);
    }

    function openDeckOverlay() {
      if (!deckOverlayEl) return;
      state.deckOverlayOpen = true;
      deckOverlayEl.hidden = false;
      deckToggleEl?.classList.add("active");
      deckToggleEl?.setAttribute("aria-pressed", "true");
      renderDeckOverlay();
      deckOverlayEl.focus();
    }

    function closeDeckOverlay() {
      if (!deckOverlayEl) return;
      state.deckOverlayOpen = false;
      deckOverlayEl.hidden = true;
      deckToggleEl?.classList.remove("active");
      deckToggleEl?.setAttribute("aria-pressed", "false");
    }

    // ─────────────────────────────────────────────────────────────────────

    function renderVerticalNav() {
      if (!verticalNavEl) return;
      const col = state.grid[state.col];
      const show = col && col.length > 1;
      verticalNavEl.hidden = !show;
      if (!show) return;

      verticalNavEl.innerHTML = "";

      // Chevron: previous chapter (left)
      const prevChevron = document.createElement("button");
      prevChevron.type = "button";
      prevChevron.className = "vn-chevron" + (state.col > 0 ? "" : " hidden");
      prevChevron.setAttribute("aria-label", "Previous chapter");
      prevChevron.innerHTML = "&#10094;";
      prevChevron.addEventListener("click", () => {
        state.col--; state.row = 0;
        syncIndexFromGrid(); renderSlide();
      });
      verticalNavEl.appendChild(prevChevron);

      // Wrapper keeps track absolute within the dots zone only
      const wrapper = document.createElement("div");
      wrapper.className = "vn-dots-wrapper";

      // Track line behind dots
      const track = document.createElement("div");
      track.className = "vn-track";
      const fill = document.createElement("div");
      fill.className = "vn-fill";
      const pct = col.length > 1 ? (state.row / (col.length - 1)) * 100 : 0;
      fill.style.height = pct + "%";
      track.appendChild(fill);
      wrapper.appendChild(track);

      col.forEach((flatIdx, rowIdx) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "vn-dot";
        dot.setAttribute("aria-label", `Go to sub-slide ${rowIdx + 1} of ${col.length}`);
        if (rowIdx < state.row) dot.classList.add("past");
        if (rowIdx === state.row) dot.classList.add("active");
        dot.addEventListener("click", () => {
          state.row = rowIdx;
          syncIndexFromGrid();
          renderSlide();
        });
        wrapper.appendChild(dot);
      });

      verticalNavEl.appendChild(wrapper);

      // Chevron: next chapter (right)
      const nextChevron = document.createElement("button");
      nextChevron.type = "button";
      nextChevron.className = "vn-chevron" + (state.col < state.grid.length - 1 ? "" : " hidden");
      nextChevron.setAttribute("aria-label", "Next chapter");
      nextChevron.innerHTML = "&#10095;";
      nextChevron.addEventListener("click", () => {
        state.col++; state.row = 0;
        syncIndexFromGrid(); renderSlide();
      });
      verticalNavEl.appendChild(nextChevron);
    }

    function renderNavArrows() {
      const hasSlides = state.slides.length > 0;
      const visible = state.showNavArrows && hasSlides;
      prevArrowEl.hidden = !visible;
      nextArrowEl.hidden = !visible;
      arrowsToggleEl.setAttribute("aria-expanded", String(visible));
      arrowsToggleEl.disabled = !hasSlides;
      if (!visible) {
        return;
      }
      prevArrowEl.disabled = state.index <= 0;
      nextArrowEl.disabled = state.index >= state.slides.length - 1;
    }

    function renderDurationBar() {
      const durationBarEl = document.getElementById("durationBar");
      if (!durationBarEl) return;
      durationBarEl.innerHTML = "";

      const hasDurations = state.slides.some(s => s.duration != null);
      const totalDuration = state.slides.reduce((sum, s) => sum + (s.duration || 0), 0);

      // Per-slide toggle button
      durationBarToggleEl.hidden = !hasDurations || !state.slides.length;
      durationBarToggleEl.disabled = !hasDurations || !state.slides.length;
      durationBarToggleEl.setAttribute("aria-pressed", String(state.showDurationBar));

      // Global toggle button
      globalDurationBarToggleEl.hidden = totalDuration === 0 || !state.slides.length;
      globalDurationBarToggleEl.disabled = totalDuration === 0 || !state.slides.length;
      globalDurationBarToggleEl.setAttribute("aria-pressed", String(state.showGlobalDurationBar));

      const currentSlide = state.slides[state.index];
      const showPerSlide = state.showDurationBar && currentSlide && currentSlide.duration != null;
      const showGlobal = state.showGlobalDurationBar && totalDuration > 0;

      durationBarEl.hidden = !showPerSlide && !showGlobal;
      if (!showPerSlide && !showGlobal) return;

      function makeBarRow(title, durationSecs, elapsedSecs) {
        const row = document.createElement("div");
        row.className = "duration-bar-row";
        const lbl = document.createElement("span");
        lbl.className = "duration-bar-label";
        const titleSpan = document.createElement("span");
        titleSpan.className = "duration-bar-label-title";
        titleSpan.textContent = title;
        const minsSpan = document.createElement("span");
        minsSpan.className = "duration-bar-label-mins";
        minsSpan.textContent = `${Math.round(durationSecs / 60)} min.`;
        lbl.appendChild(titleSpan);
        lbl.appendChild(minsSpan);
        const track = document.createElement("div");
        track.className = "slide-duration-bar-track";
        const fill = document.createElement("div");
        fill.className = "slide-duration-bar-fill";
        fill.style.animationDuration = `${durationSecs}s`;
        fill.style.animationDelay = `-${Math.min(elapsedSecs, durationSecs)}s`;
        track.appendChild(fill);
        row.appendChild(lbl);
        row.appendChild(track);
        return row;
      }

      if (showPerSlide) {
        const elapsedSecs = Math.min(
          (Date.now() - state.slideStartedAt) / 1000,
          currentSlide.duration
        );
        durationBarEl.appendChild(makeBarRow("Slide", currentSlide.duration, elapsedSecs));
      }

      if (showGlobal) {
        const slidesBeforeElapsed = state.slides
          .slice(0, state.index)
          .reduce((sum, s) => sum + (s.duration || 0), 0);
        const currentElapsed = currentSlide && currentSlide.duration
          ? Math.min((Date.now() - state.slideStartedAt) / 1000, currentSlide.duration)
          : 0;
        const globalElapsedSecs = slidesBeforeElapsed + currentElapsed;
        durationBarEl.appendChild(makeBarRow("Total", totalDuration, globalElapsedSecs));
      }
    }

    function renderTrainMapLinear() {
      const track = document.createElement("div");
      track.className = "train-track";
      trainMapEl.appendChild(track);

      const progress = document.createElement("div");
      progress.className = "train-progress";
      const progressRatio = state.slides.length > 1 ? state.index / (state.slides.length - 1) : 0;
      progress.style.width = `calc((100% - 48px) * ${progressRatio})`;
      trainMapEl.appendChild(progress);

      const stationList = document.createElement("div");
      stationList.className = "station-list";

      const hasDurations = state.slides.some(s => s.duration != null);
      trainMapEl.classList.toggle("has-durations", hasDurations);

      state.slides.forEach((slide, idx) => {
        const step = document.createElement("div");
        step.className = "station-step";

        const station = document.createElement("button");
        station.type = "button";
        station.className = "station";
        if (idx < state.index) {
          station.classList.add("past");
        }
        if (idx === state.index) {
          station.classList.add("active");
          station.setAttribute("aria-current", "step");
        }
        const headingMatch = slide.html.match(/<h[1-3][^>]*>([\s\S]*?)<\/h[1-3]>/i);
        const rawTitle = headingMatch ? decodeHtml(headingMatch[1]) : "";
        const titleText = rawTitle ? ` – ${rawTitle}` : "";
        const durationLabel = slide.duration != null ? ` (${formatDuration(slide.duration)})` : "";
        station.setAttribute("aria-label", `Go to slide ${idx + 1}${titleText}${durationLabel}`);
        station.title = `Slide ${idx + 1}${titleText}${durationLabel}`;
        station.addEventListener("click", () => {
          state.index = idx;
          syncGridFromIndex();
          renderSlide();
        });

        const num = document.createElement("span");
        num.className = "station-num";
        num.textContent = String(idx + 1);

        step.appendChild(station);
        step.appendChild(num);

        if (rawTitle) {
          const labelEl = document.createElement("span");
          labelEl.className = "station-label";
          const trimmed = rawTitle.slice(0, 10);
          labelEl.textContent = rawTitle.length > 10 ? trimmed + "…" : trimmed;
          step.appendChild(labelEl);
        }

        if (slide.duration != null) {
          const dur = document.createElement("span");
          dur.className = "station-duration";
          dur.textContent = formatDuration(slide.duration);
          step.appendChild(dur);
        }

        stationList.appendChild(step);
      });

      trainMapEl.appendChild(stationList);

      if (state.grid.length > 1) {
        state.grid.slice(1).forEach(col => {
          const boundaryIdx = col[0];
          const ratio = state.slides.length > 1 ? boundaryIdx / (state.slides.length - 1) : 0;
          const tick = document.createElement("div");
          tick.className = "section-tick";
          tick.style.left = `calc(24px + (100% - 48px) * ${ratio})`;
          trainMapEl.appendChild(tick);
        });
      }

      updateSlideAlignment();
    }

    function renderTrainMap() {
      trainMapEl.innerHTML = "";

      if (!state.slides.length) {
        state.showTrainMap = false;
        appEl.classList.remove("train-visible");
        if (mapToggleEl) {
          mapToggleEl.disabled = true;
          mapToggleEl.setAttribute("aria-pressed", "false");
          mapToggleEl.setAttribute("aria-expanded", "false");
        }
        trainMapEl.setAttribute("aria-hidden", "true");
        return;
      }

      if (mapToggleEl) {
        mapToggleEl.disabled = false;
        mapToggleEl.setAttribute("aria-pressed", String(state.showTrainMap));
        mapToggleEl.setAttribute("aria-expanded", String(state.showTrainMap));
      }
      trainMapEl.setAttribute("aria-hidden", String(!state.showTrainMap));
      appEl.classList.toggle("train-visible", state.showTrainMap);
      if (!state.showTrainMap) {
        updateSlideAlignment();
        return;
      }

      const is2D = state.grid.length > 1;
      trainMapEl.classList.toggle("is-2d", is2D);
      trainMapEl.classList.toggle("has-durations", !is2D && state.slides.some(s => s.duration != null));

      if (state.trainMapHeight != null) {
        trainMapEl.style.height = state.trainMapHeight + "px";
      } else if (is2D) {
        state.trainMapHeight = 160;
        trainMapEl.style.height = "160px";
      } else {
        trainMapEl.style.height = "";
      }

      const handle = document.createElement("div");
      handle.className = "train-resize-handle";
      handle.setAttribute("aria-label", "Drag to resize route map");
      handle.title = "Drag to resize";
      trainMapEl.appendChild(handle);

      let dragStartY, dragStartHeight;
      handle.addEventListener("pointerdown", e => {
        e.preventDefault();
        dragStartY = e.clientY;
        dragStartHeight = trainMapEl.offsetHeight;
        handle.setPointerCapture(e.pointerId);
      });
      handle.addEventListener("pointermove", e => {
        if (!handle.hasPointerCapture(e.pointerId)) return;
        const delta = dragStartY - e.clientY;
        const maxH = Math.floor(slideEl.clientHeight * 0.75);
        const newH = Math.max(60, Math.min(maxH, dragStartHeight + delta));
        trainMapEl.style.height = newH + "px";
        state.trainMapHeight = newH;
      });

      if (!is2D) {
        renderTrainMapLinear();
        return;
      }

      const gridEl = document.createElement("div");
      gridEl.className = "train-grid";

      state.grid.forEach((column, colIdx) => {
        const isActiveCol = colIdx === state.col;
        const colEl = document.createElement("div");
        colEl.className = "train-col" + (isActiveCol ? " active-col" : "");

        const h1Match = (state.slides[column[0]]?.html || "").match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
        const title = h1Match ? decodeHtml(h1Match[1]) : `Section ${colIdx + 1}`;
        const headerEl = document.createElement("div");
        headerEl.className = "train-col-header";
        headerEl.textContent = title.length > 18 ? title.slice(0, 16) + "…" : title;
        headerEl.title = title;
        colEl.appendChild(headerEl);

        column.forEach((flatIdx, rowIdx) => {
          const slide = state.slides[flatIdx];
          const isActive = isActiveCol && rowIdx === state.row;
          const station = document.createElement("button");
          station.type = "button";
          station.className = "station" + (flatIdx < state.index ? " past" : "") + (isActive ? " active" : "");
          if (isActive) station.setAttribute("aria-current", "step");
          const slideHeadingMatch = slide.html.match(/<h[1-3][^>]*>([\s\S]*?)<\/h[1-3]>/i);
          const slideTitle = slideHeadingMatch ? decodeHtml(slideHeadingMatch[1]) : "";
          const slideTitleText = slideTitle ? ` – ${slideTitle}` : "";
          const durLabel = slide.duration != null ? ` (${formatDuration(slide.duration)})` : "";
          station.setAttribute("aria-label", `Go to ${title}, slide ${rowIdx + 1}${slideTitleText}${durLabel}`);
          station.title = `${title} ${rowIdx + 1}${slideTitleText}${durLabel}`;
          station.addEventListener("click", () => {
            state.col = colIdx;
            state.row = rowIdx;
            syncIndexFromGrid();
            renderSlide();
          });
          const numEl = document.createElement("span");
          numEl.className = "station-num";
          numEl.textContent = String(rowIdx + 1);
          colEl.appendChild(station);
          colEl.appendChild(numEl);
          if (slide.duration != null) {
            const dur = document.createElement("span");
            dur.className = "station-duration";
            dur.textContent = formatDuration(slide.duration);
            colEl.appendChild(dur);
          }
        });

        const progressEl = document.createElement("div");
        progressEl.className = "col-progress";
        const fillEl = document.createElement("div");
        fillEl.className = "col-progress-fill";
        const rowProgress = isActiveCol
          ? (column.length > 1 ? state.row / (column.length - 1) : 1)
          : (column.every(fi => fi < state.index) ? 1 : 0);
        fillEl.style.width = `${rowProgress * 100}%`;
        progressEl.appendChild(fillEl);
        colEl.appendChild(progressEl);

        gridEl.appendChild(colEl);
      });

      trainMapEl.appendChild(gridEl);
      updateSlideAlignment();
    }

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || "");
        state.sourceMarkdown = text;
        state.slides = parseSlides(text);
        buildGrid();
        state.index = 0;
        state.col = 0;
        state.row = 0;
        if (state.search.query.trim()) {
          rebuildSearchResults();
        }
        if (editorTextareaEl && appEl?.classList.contains("split-view")) {
          editorTextareaEl.value = text;
          updateEditorStatus();
        }
        renderSlide();
      };
      reader.readAsText(file);
    }

    function handleUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      loadFile(file);
      event.target.value = "";
    }

    async function resolveObsidianPublishUrl(url) {
      const parsed = new URL(url);
      const parts = parsed.pathname.replace(/^\//, "").split("/");
      const siteSlug = parts[0];
      const pathSegments = parts.slice(1);

      const pageHtml = await (await fetch(`https://publish.obsidian.md/${siteSlug}/`)).text();
      const uidMatch = pageHtml.match(/["']uid["']\s*:\s*["']([a-f0-9]{32})["']/);
      if (!uidMatch) throw new Error("Could not find Obsidian Publish site UID.");
      const uid = uidMatch[1];

      const encodedPath = pathSegments
        .map(seg => encodeURIComponent(decodeURIComponent(seg.replace(/\+/g, " "))))
        .join("/");
      const withExt = encodedPath.endsWith(".md") ? encodedPath : encodedPath + ".md";

      return `https://publish-01.obsidian.md/access/${uid}/${withExt}`;
    }

    function setUrlLoadPanelOpen(open) {
      if (!urlLoadPanelEl) return;
      urlLoadPanelEl.hidden = !open;
      if (open && urlLoadInputEl) {
        urlLoadInputEl.focus();
        if (urlLoadErrorEl) urlLoadErrorEl.hidden = true;
      }
    }

    async function loadFromUrl(url) {
      const trimmed = String(url || "").trim();
      if (!trimmed) return;
      let parsedUrl;
      try {
        parsedUrl = new URL(trimmed);
      } catch {
        parsedUrl = null;
      }
      if (!parsedUrl || !["http:", "https:"].includes(parsedUrl.protocol)) {
        if (urlLoadErrorEl) {
          urlLoadErrorEl.textContent = "Please enter a valid http(s) URL.";
          urlLoadErrorEl.hidden = false;
        }
        return;
      }
      if (urlLoadSubmitEl) {
        urlLoadSubmitEl.disabled = true;
        urlLoadSubmitEl.textContent = "Loading…";
      }
      if (urlLoadErrorEl) urlLoadErrorEl.hidden = true;
      try {
        let fetchUrl = /^https:\/\/github\.com\/[^/]+\/[^/]+\/blob\//.test(trimmed)
          ? trimmed.replace('https://github.com/', 'https://raw.githubusercontent.com/').replace('/blob/', '/')
          : /^https:\/\/gitlab\.com\/.+\/-\/blob\//.test(trimmed)
          ? trimmed.replace('/-/blob/', '/-/raw/')
          : /^https:\/\/bitbucket\.org\/[^/]+\/[^/]+\/src\//.test(trimmed)
          ? trimmed.replace('/src/', '/raw/')
          : trimmed;
        if (/^https:\/\/publish\.obsidian\.md\//.test(trimmed)) {
          fetchUrl = await resolveObsidianPublishUrl(trimmed);
        }
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        state.sourceMarkdown = text;
        state.slides = parseSlides(text);
        buildGrid();
        state.index = 0;
        state.col = 0;
        state.row = 0;
        if (state.search.query.trim()) rebuildSearchResults();
        if (editorTextareaEl && appEl?.classList.contains("split-view")) {
          editorTextareaEl.value = text;
          updateEditorStatus();
        }
        setUrlLoadPanelOpen(false);
        renderSlide();
      } catch (err) {
        const msg = String(err?.message || err);
        if (urlLoadErrorEl) {
          urlLoadErrorEl.textContent = msg.toLowerCase().includes("failed to fetch") || msg.toLowerCase().includes("networkerror")
            ? "Network error — check the URL or the server's CORS settings."
            : `Could not load: ${msg}`;
          urlLoadErrorEl.hidden = false;
        }
      } finally {
        if (urlLoadSubmitEl) {
          urlLoadSubmitEl.disabled = false;
          urlLoadSubmitEl.textContent = "Load";
        }
      }
    }

    slideEl.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) {
        return;
      }
      const action = target.getAttribute("data-action");
      if (action === "upload") {
        fileInputEl.click();
      }
      if (action === "url-load-toggle") {
        setUrlLoadPanelOpen(true);
      }
      if (action === "playlist-toggle") {
        setPlaylistPanelOpen(true);
      }
      if (action === "delimiter-toggle") {
        if (delimiterPanelEl.hidden) {
          setDelimiterPanelOpen(true, target);
        }
      }
    });
    fileInputEl.addEventListener("change", handleUpload);
    delimiterOptionEls.forEach((option) => {
      option.addEventListener("click", () => {
        const kind = option.dataset.kind;
        if (kind === "slide-mode") {
          delimiterDraft.slideMode = "h1";
        } else if (kind === "notes") {
          delimiterDraft.notes = option.dataset.delimiter || "--";
        } else {
          delimiterDraft.slideMode = "delimiter";
          delimiterDraft.slide = option.dataset.delimiter || "---";
        }
        renderDelimiterUI();
      });
    });
    slideDelimiterInputEl?.addEventListener("input", () => {
      delimiterDraft.slideMode = "delimiter";
      delimiterDraft.slide = slideDelimiterInputEl.value;
      renderDelimiterUI();
    });
    notesDelimiterInputEl?.addEventListener("input", () => {
      delimiterDraft.notes = notesDelimiterInputEl.value;
      renderDelimiterUI();
    });
    delimiterApplyEl?.addEventListener("click", () => {
      const applied = applyDelimiters(delimiterDraft.slideMode, delimiterDraft.slide, delimiterDraft.notes);
      if (applied) {
        setDelimiterPanelOpen(false);
      }
    });
    overviewToggleEl?.addEventListener("click", toggleOverview);
    deckToggleEl?.addEventListener("click", () => {
      if (state.deckOverlayOpen) closeDeckOverlay(); else openDeckOverlay();
    });

    mapToggleEl.addEventListener("click", () => {
      if (!state.slides.length) {
        return;
      }
      state.showTrainMap = !state.showTrainMap;
      renderTrainMap();
      announceStatus(state.showTrainMap ? "Route map shown." : "Route map hidden.");
    });
    durationBarToggleEl.addEventListener("click", () => {
      state.showDurationBar = !state.showDurationBar;
      renderDurationBar();
      announceStatus(state.showDurationBar ? "Duration bar shown." : "Duration bar hidden.");
    });
    globalDurationBarToggleEl.addEventListener("click", () => {
      state.showGlobalDurationBar = !state.showGlobalDurationBar;
      renderDurationBar();
      announceStatus(state.showGlobalDurationBar ? "Global duration bar shown." : "Global duration bar hidden.");
    });
    sectionTitleToggleEl.addEventListener("click", () => {
      state.showSectionTitle = !state.showSectionTitle;
      sectionTitleToggleEl.setAttribute("aria-pressed", String(state.showSectionTitle));
      sectionTitleToggleEl.classList.toggle("active", state.showSectionTitle);
      updateSectionTitleBar();
      announceStatus(state.showSectionTitle ? "Section title banner shown." : "Section title banner hidden.");
    });
    arrowsToggleEl.addEventListener("click", () => {
      if (!state.slides.length) {
        return;
      }
      state.showNavArrows = !state.showNavArrows;
      renderNavArrows();
      announceStatus(state.showNavArrows ? "Navigation arrows shown." : "Navigation arrows hidden.");
    });
    prevArrowEl.addEventListener("click", goPrev);
    nextArrowEl.addEventListener("click", goNext);
    searchToggleEl.addEventListener("click", () => {
      toggleSearchPanel();
    });
    searchCloseEl.addEventListener("click", () => {
      setSearchPanelOpen(false);
    });
    searchInputEl.addEventListener("input", () => {
      state.search.query = searchInputEl.value;
      rebuildSearchResults();
    });
    searchInputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        if (event.shiftKey) {
          goToPreviousSearchResult();
        } else {
          goToNextSearchResult();
        }
      }
      if (event.key === "Escape") {
        event.preventDefault();
        setSearchPanelOpen(false);
      }
    });
    searchNextEl.addEventListener("click", goToNextSearchResult);
    searchPrevEl.addEventListener("click", goToPreviousSearchResult);

    function isInteractiveTarget(element) {
      if (!(element instanceof HTMLElement)) {
        return false;
      }
      return Boolean(
        element.closest("input, textarea, select, button, a, [contenteditable='true'], video, iframe")
      );
    }

    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "f") {
        event.preventDefault();
        if (!state.search.panelOpen) {
          setSearchPanelOpen(true);
        } else {
          searchInputEl.focus();
          searchInputEl.select();
        }
        return;
      }

      if (event.key === "Escape") {
        if (state.deckOverlayOpen) {
          closeDeckOverlay();
          return;
        }
        if (state.overviewOpen) {
          closeOverview();
          return;
        }
        if (!playlistPanelEl?.hidden) {
          setPlaylistPanelOpen(false);
          return;
        }
        if (state.search.panelOpen) {
          setSearchPanelOpen(false);
          return;
        }
        if (!zoomPanelEl?.hidden) {
          setZoomPanelOpen(false);
          return;
        }
        if (!settingsPanelEl?.hidden) {
          setSettingsPanelOpen(false);
          return;
        }
      }

      if (isInteractiveTarget(event.target)) {
        return;
      }

      if (event.key === "ArrowRight")  { event.preventDefault(); goRight(); }
      if (event.key === "ArrowLeft")   { event.preventDefault(); goLeft();  }
      if (event.key === "ArrowDown")   { event.preventDefault(); goDown();  }
      if (event.key === "ArrowUp")     { event.preventDefault(); goUp();    }
      if (event.key === " " || event.key === "PageDown") { event.preventDefault(); goNext(); }
      if (event.key === "PageUp")      { event.preventDefault(); goPrev();  }
      if (event.key.toLowerCase() === "o" && !event.ctrlKey && !event.metaKey && !event.altKey && state.grid.length > 1) {
        toggleOverview();
      }
      if (event.key.toLowerCase() === "d" && !event.ctrlKey && !event.metaKey && !event.altKey && state.playlist.length) {
        if (state.deckOverlayOpen) closeDeckOverlay(); else openDeckOverlay();
      }
      if (state.deckOverlayOpen && /^[1-9]$/.test(event.key)) {
        event.preventDefault();
        switchToDeck(parseInt(event.key, 10) - 1);
      }
      if (event.key.toLowerCase() === "m" && event.altKey && state.slides.length) {
        state.showTrainMap = !state.showTrainMap;
        renderTrainMap();
        announceStatus(state.showTrainMap ? "Route map shown." : "Route map hidden.");
      }
      if (event.key.toLowerCase() === "f" && !event.ctrlKey && !event.metaKey && !event.altKey) {
        toggleFullscreen();
      }
    });

    renderDelimiterUI();
    window.addEventListener("resize", () => {
      if (!delimiterPanelEl.hidden) {
        positionDelimiterPanel(delimiterAnchorEl);
      }
    });
    window.addEventListener("resize", updateSlideAlignment);

    // ── Fullscreen ────────────────────────────────────────────────────────
    function updateFullscreenButton() {
      const isFS = !!document.fullscreenElement;
      if (!fullscreenToggleEl) return;
      fullscreenToggleEl.querySelector(".material-symbols-outlined").textContent =
        isFS ? "fullscreen_exit" : "fullscreen";
      fullscreenToggleEl.setAttribute("aria-label", isFS ? "Exit fullscreen" : "Enter fullscreen");
      fullscreenToggleEl.title = isFS ? "Exit fullscreen (F)" : "Enter fullscreen (F)";
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    fullscreenToggleEl?.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    // ─────────────────────────────────────────────────────────────────────

    // ── Zoom panel events ─────────────────────────────────────────────────
    zoomToggleEl?.addEventListener("click", () => {
      setSettingsPanelOpen(false);
      setZoomPanelOpen(zoomPanelEl.hidden, zoomToggleEl);
    });

    zoomOutEl?.addEventListener("click", () => {
      stepZoom(-1);
    });

    zoomInEl?.addEventListener("click", () => {
      stepZoom(1);
    });

    zoomResetEl?.addEventListener("click", () => {
      resetZoom();
    });

    // ─────────────────────────────────────────────────────────────────────

    // ── Settings panel events ─────────────────────────────────────────────
    settingsToggleEl?.addEventListener("click", () => {
      setZoomPanelOpen(false);
      setSettingsPanelOpen(settingsPanelEl.hidden, settingsToggleEl);
    });

    document.getElementById("helpToggle")?.addEventListener("click", () => {
      window.open("https://jourde.github.io/markdown-slidedeck/how-to-use.html", "_blank", "noopener,noreferrer");
    });

    settingsPanelEl?.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-settings-bg], [data-settings-font], #settingsReset");
      if (!btn) return;
      e.stopPropagation(); // prevent bubbling to the outside-click handler after innerHTML is replaced
      if (btn.dataset.settingsBg)   applySettings({ ...appSettings, bg:   btn.dataset.settingsBg });
      if (btn.dataset.settingsFont) applySettings({ ...appSettings, font: btn.dataset.settingsFont });
      if (btn.id === "settingsReset") applySettings({ ...SETTINGS_DEFAULTS });
    });

    document.addEventListener("click", (e) => {
      if (!zoomPanelEl?.hidden &&
          !zoomPanelEl.contains(e.target) &&
          !zoomToggleEl.contains(e.target)) {
        setZoomPanelOpen(false);
      }
      if (!settingsPanelEl?.hidden &&
          !settingsPanelEl.contains(e.target) &&
          !settingsToggleEl.contains(e.target)) { // use contains() to cover clicks on the icon span inside the button
        setSettingsPanelOpen(false);
      }
    });

    window.addEventListener("resize", () => {
      if (!zoomPanelEl?.hidden) positionZoomPanel(zoomAnchorEl);
    });

    window.addEventListener("resize", () => {
      if (!settingsPanelEl?.hidden) positionSettingsPanel(settingsAnchorEl);
    });
    // ─────────────────────────────────────────────────────────────────────

    // ── Outline / Plan panel ──────────────────────────────────────────────
    let outlineAnchorEl = null;

    if (outlineLevelsEl) {
      outlineLevelsEl.addEventListener("click", e => {
        const btn = e.target.closest(".outline-panel__level");
        if (!btn) return;
        outlineMaxLevel = parseInt(btn.dataset.level);
        outlineLevelsEl.querySelectorAll(".outline-panel__level").forEach(b => {
          b.classList.toggle("active", parseInt(b.dataset.level) <= outlineMaxLevel);
        });
        buildOutline();
      });
    }

    function positionOutlinePanel(anchorEl) {
      if (!outlinePanelEl || !anchorEl || outlinePanelEl.hidden) return;
      const rect = anchorEl.getBoundingClientRect();
      const panelRect = outlinePanelEl.getBoundingClientRect();
      const margin = 12;
      const gap = 8;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      let top = rect.top - panelRect.height - gap;
      if (top < margin) top = rect.bottom + gap;
      top = Math.max(margin, Math.min(top, vh - panelRect.height - margin));

      let left = rect.right - panelRect.width;
      left = Math.max(margin, Math.min(left, vw - panelRect.width - margin));

      outlinePanelEl.style.maxHeight = `${vh - top - margin}px`;
      outlinePanelEl.style.top  = `${top}px`;
      outlinePanelEl.style.left = `${left}px`;
    }

    function buildOutline() {
      if (!outlineListEl) return;
      outlineListEl.innerHTML = "";
      if (!state.grid.length) return;
      const _tmp = document.createElement("div");

      function makeItem(title, slideIdx, isHidden, isCurrent, level, onToggle) {
        const li = document.createElement("li");
        if (level > 1) li.className = "outline-panel__subitem";
        if (level > 1) li.style.paddingLeft = `${(level - 1) * 16}px`;
        if (isCurrent) li.classList.add("is-current");
        if (isHidden) li.classList.add("is-hidden");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = !isHidden;
        checkbox.className = "outline-panel__check";
        checkbox.setAttribute("aria-label", (isHidden ? "Show " : "Hide ") + title);
        checkbox.addEventListener("change", () => { onToggle(checkbox.checked); buildOutline(); });
        const btn = document.createElement("button");
        btn.textContent = title;
        btn.addEventListener("click", () => { state.index = slideIdx; renderSlide(); setOutlinePanelOpen(false); });
        li.appendChild(checkbox);
        li.appendChild(btn);
        return li;
      }

      state.grid.forEach((colSlides, colIdx) => {
        let colTitle = "";
        let colJumpIdx = colSlides[0];
        for (const si of colSlides) {
          const m = state.slides[si]?.html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
          if (m) {
            _tmp.innerHTML = m[1].replace(/<[^>]+>/g, "");
            colTitle = _tmp.textContent.replace(/\s+/g, " ").trim();
            colJumpIdx = si;
            break;
          }
        }
        if (!colTitle) return;
        outlineListEl.appendChild(makeItem(
          colTitle, colJumpIdx, state.hiddenSections.has(colIdx),
          colSlides.includes(state.index), 1,
          checked => checked ? state.hiddenSections.delete(colIdx) : state.hiddenSections.add(colIdx)
        ));
        colSlides.slice(1).forEach(si => {
          const m = state.slides[si]?.html.match(/<h([2-6])[^>]*>([\s\S]*?)<\/h\1>/i);
          if (!m) return;
          const level = parseInt(m[1]);
          if (level > outlineMaxLevel) return;
          _tmp.innerHTML = m[2].replace(/<[^>]+>/g, "");
          const subTitle = _tmp.textContent.replace(/\s+/g, " ").trim();
          if (!subTitle) return;
          outlineListEl.appendChild(makeItem(
            subTitle, si, state.hiddenSlides.has(si),
            si === state.index, level,
            checked => checked ? state.hiddenSlides.delete(si) : state.hiddenSlides.add(si)
          ));
        });
      });
    }

    function setOutlinePanelOpen(open, anchorEl = null) {
      if (!outlinePanelEl) return;
      outlinePanelEl.hidden = !open;
      if (outlineToggleEl) {
        outlineToggleEl.setAttribute("aria-expanded", String(open));
        outlineToggleEl.classList.toggle("active", open);
      }
      if (open) {
        if (anchorEl) outlineAnchorEl = anchorEl;
        buildOutline();
        positionOutlinePanel(outlineAnchorEl);
      }
    }

    outlineToggleEl?.addEventListener("click", () => {
      setZoomPanelOpen(false);
      setSettingsPanelOpen(false);
      setOutlinePanelOpen(outlinePanelEl.hidden, outlineToggleEl);
    });

    document.addEventListener("click", (e) => {
      if (!outlinePanelEl?.hidden &&
          !outlinePanelEl.contains(e.target) &&
          !outlineToggleEl.contains(e.target)) {
        setOutlinePanelOpen(false);
      }
    });

    window.addEventListener("resize", () => {
      if (!outlinePanelEl?.hidden) positionOutlinePanel(outlineAnchorEl);
    });
    // ─────────────────────────────────────────────────────────────────────

    // ── Load from URL events ───────────────────────────────────────────────
    urlLoadCloseEl?.addEventListener("click", () => {
      setUrlLoadPanelOpen(false);
    });

    urlLoadSubmitEl?.addEventListener("click", () => {
      loadFromUrl(urlLoadInputEl?.value);
    });

    urlLoadInputEl?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadFromUrl(urlLoadInputEl.value);
      if (e.key === "Escape") setUrlLoadPanelOpen(false);
    });
    // ─────────────────────────────────────────────────────────────────────

    // ── Split-view editor ────────────────────────────────────────────────
    const splitToggleEl    = document.getElementById("splitToggle");
    const editorPanelEl    = document.getElementById("editorPanel");
    const editorTextareaEl = document.getElementById("editorTextarea");
    const editorStatusEl   = document.getElementById("editorStatus");
    const editorDownloadEl = document.getElementById("editorDownloadBtn");

    function openEditor() {
      editorTextareaEl.value = state.sourceMarkdown;
      updateEditorStatus();
    }

    function updateEditorStatus() {
      const lines = editorTextareaEl.value.split("\n").length;
      const chars = editorTextareaEl.value.length;
      const count = state.slides.length;
      editorStatusEl.textContent = `${lines} lines · ${chars} chars · ${count} slide${count !== 1 ? "s" : ""}`;
    }

    function toggleSplitView() {
      const isActive = appEl.classList.toggle("split-view");
      splitToggleEl.setAttribute("aria-pressed", String(isActive));
      splitToggleEl.classList.toggle("active", isActive);
      if (isActive) {
        openEditor();
      }
    }

    let editorDebounceTimer = null;
    editorTextareaEl?.addEventListener("input", () => {
      clearTimeout(editorDebounceTimer);
      editorDebounceTimer = setTimeout(() => {
        const text = editorTextareaEl.value;
        state.sourceMarkdown = text;
        state.slides = parseSlides(text);
        buildGrid();
        state.index = Math.min(state.index, Math.max(0, state.slides.length - 1));
        syncGridFromIndex();
        renderSlide();
        updateEditorStatus();
      }, EDITOR_DEBOUNCE_MS);
    });

    editorDownloadEl?.addEventListener("click", () => {
      const text = editorTextareaEl.value || state.sourceMarkdown;
      if (!text) return;
      const meta = state.frontmatter || {};
      const rawTitle = meta.title || "slides";
      const filename = rawTitle.replace(/[^a-zA-Z0-9_\- ]/g, "_").trim() + ".md";
      const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), BLOB_REVOKE_MS);
    });

    splitToggleEl?.addEventListener("click", toggleSplitView);
    // ─────────────────────────────────────────────────────────────────────

    loadSettings();
    renderSlide();
  </script>
</body>
</html>
